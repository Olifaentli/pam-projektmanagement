<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect width="1000" height="640" fill="#FFFFFF"/><text x="24" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B3138">Entwurf 1 — Anmeldung  (/login)</text><text x="24" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5B6570">US-7: Am System anmelden</text><rect x="330" y="110" width="340" height="400" rx="4" fill="#FFFFFF" stroke="#9AA3AE" stroke-width="1.5"/><text x="360" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B3138" text-anchor="start">Anmeldung</text><text x="360" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6570" text-anchor="start">Projekt- und Aufgabenmanagement</text><text x="360" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6570" text-anchor="start">E-Mail</text><rect x="360" y="210" width="280" height="34" rx="4" fill="#FFFFFF" stroke="#9AA3AE" stroke-width="1.5"/><text x="360" y="279" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6570" text-anchor="start">Passwort</text><rect x="360" y="285" width="280" height="34" rx="4" fill="#FFFFFF" stroke="#9AA3AE" stroke-width="1.5"/><rect x="360" y="345" width="280" height="34" rx="4" fill="#5B6570" stroke="#9AA3AE" stroke-width="1.5"/><text x="500.0" y="366.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Anmelden</text><rect x="360" y="400" width="280" height="84" rx="4" fill="#F7F8FA" stroke="#9AA3AE" stroke-width="1.5" stroke-dasharray="4 3"/><text x="374" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6570" text-anchor="start">Hinweisfeld mit Testkonten</text><text x="374" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6570" text-anchor="start">(nur in der Entwicklungsumgebung)</text><text x="24" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6570" text-anchor="start">Fehlerfall: Über den Feldern erscheint ein Meldungsband mit der Servermeldung.</text><text x="24" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6570" text-anchor="start">Die Schaltfläche bleibt gesperrt, solange ein Feld leer ist — abgeleitet aus dem React-State.</text><text x="24" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6570" text-anchor="start">Keine Navigation sichtbar: Vor der Anmeldung gibt es nichts zu navigieren.</text></svg>