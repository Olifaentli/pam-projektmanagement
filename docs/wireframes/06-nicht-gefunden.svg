<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect width="1000" height="640" fill="#FFFFFF"/><text x="24" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B3138">Entwurf 6 — Nicht gefunden  (/404)</text><text x="24" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5B6570">Auffangseite für unbekannte Adressen</text><rect x="24" y="66" width="952" height="44" rx="4" fill="#EDEFF2" stroke="#9AA3AE" stroke-width="1.5"/><text x="40" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#2B3138" text-anchor="start">Projekt- und Aufgabenmanagement</text><text x="750" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6570" text-anchor="start">Name der Person</text><rect x="870" y="78" width="80" height="22" rx="4" fill="#FFFFFF" stroke="#9AA3AE" stroke-width="1.5"/><text x="910.0" y="93.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#2B3138" text-anchor="middle">Abmelden</text><rect x="24" y="110" width="170" height="420" rx="4" fill="#FFFFFF" stroke="#9AA3AE" stroke-width="1.5"/><text x="44" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#2B3138" text-anchor="start">Übersicht</text><text x="44" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#2B3138" text-anchor="start">Projekte</text><text x="44" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#2B3138" text-anchor="start">Benutzerverwaltung</text><text x="30" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6570" text-anchor="start">(nur Rolle ADMIN)</text><text x="600" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B3138" text-anchor="middle">Seite nicht gefunden</text><text x="600" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6570" text-anchor="middle">Die aufgerufene Adresse existiert nicht oder ist nicht freigegeben.</text><rect x="530" y="336" width="140" height="34" rx="4" fill="#5B6570" stroke="#9AA3AE" stroke-width="1.5"/><text x="600.0" y="357.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Zur Übersicht</text><text x="24" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6570" text-anchor="start">Navigation bleibt erhalten, damit der Weg zurück immer offensteht.</text><text x="24" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6570" text-anchor="start">Dieselbe Seite erscheint auch, wenn ein Projekt zwar existiert, aber nicht freigegeben ist —</text><text x="24" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5B6570" text-anchor="start">die Oberfläche unterscheidet beides nicht, um keine Rückschlüsse auf fremde Daten zu erlauben.</text></svg>